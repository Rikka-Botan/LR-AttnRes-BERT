[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lr-attnres-bert"
version = "0.1.0"
description = "LR-AttnRes-BERT: a GQA + RoPE + ReLU^2 encoder with Block Sliced Low-Rank Attention Residuals (inference code)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.7"]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lr_attnres_bert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
